plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.sheetmusic.pitchrelay'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 33
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main {
            def libsDir = file('../app/libs')
            def hasUniSdk = libsDir.exists() && libsDir.listFiles()?.any {
                def n = it.name.toLowerCase()
                n.endsWith('.jar') || n.endsWith('.aar')
            }
            if (!hasUniSdk) {
                java.srcDirs += 'src/stubs/java'
            }
        }
    }
}

dependencies {
    compileOnly fileTree(dir: '../app/libs', include: ['*.jar', '*.aar'])
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'org.java-websocket:Java-WebSocket:1.5.6'
}
